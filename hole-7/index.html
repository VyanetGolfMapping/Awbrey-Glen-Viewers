<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>AWBREY GLEN · HOLE 7 — VYANET Interactive</title>
<style>
:root {
  --green:#16a34a; --green-bright:#22c55e; --green-dark:#15803d;
  --bg:#0a0a0a; --bg2:#111; --panel:#141414; --stage:#000;
  --ink:#f5f5f5; --muted:#a3a3a3; --line:#262626; --teal:#16a34a; --teal-dark:#22c55e;
  --legend-w:260px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:rgba(22,163,74,.22); }
html,body { height:100%; margin:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  overflow:hidden;
}
header {
  background:#0a0a0a; color:#fff; padding:10px 14px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-left:4px solid var(--green); border-bottom:1px solid var(--line); flex:0 0 auto;
}
header h1 { margin:0; font-size:15px; letter-spacing:.04em; font-weight:800; color:#fff; }
header p { margin:3px 0 0; font-size:11px; color:#a3a3a3; line-height:1.35; }
header img { height:44px; width:auto; }
.tabs {
  display:flex; flex-wrap:nowrap; gap:6px; padding:8px 10px;
  background:var(--bg2); border-bottom:1px solid var(--line);
  overflow-x:auto; flex:0 0 auto; -webkit-overflow-scrolling:touch;
}
.tab {
  flex:1 1 0; min-width:72px; text-align:center; text-decoration:none;
  color:#d4d4d4; font-weight:700; font-size:12px; padding:10px 8px;
  border-radius:999px; background:#1a1a1a; min-height:44px;
  display:flex; align-items:center; justify-content:center; border:1px solid #2a2a2a; cursor:pointer;
  white-space:nowrap;
}
.tab:hover { border-color:var(--green); color:#fff; }
.tab.active { background:var(--green); color:#fff; border-color:var(--green); }
.tab.cta { background:#0a0a0a; color:var(--green-bright); border-color:#2a2a2a; text-decoration:none; }
.main {
  flex:1 1 auto; display:flex; min-height:0; background:var(--bg);
}
.map-col {
  flex:1 1 auto; min-width:0; position:relative; display:flex; flex-direction:column;
  background:var(--stage);
}
.map-stage {
  flex:1 1 auto; position:relative; overflow:hidden; touch-action:none;
  cursor:grab; user-select:none; background:#000;
}
.map-stage.dragging { cursor:grabbing; }
.map-stage.edit-pins { cursor:crosshair; }
.map-world {
  position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;
}
#pins {
  position:absolute; left:0; top:0; width:100%; height:100%;
  pointer-events:none;
}
.map-world img.layer {
  display:block; width:auto; height:auto; max-width:none;
  pointer-events:none; user-select:none;
}
.pin {
  position:absolute; width:52px; height:52px; margin-left:-26px; margin-top:-26px;
  border-radius:50%; background:#fff; color:#0a0a0a; font-weight:900;
  font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center;
  border:3px solid #0a0a0a; box-shadow:0 3px 12px rgba(0,0,0,.55);
  cursor:pointer; z-index:5; touch-action:none;
}
.pin:hover, .pin:focus { transform:scale(1.06); outline:none; }
.pin.dragging { transform:scale(1.1); background:#f8fafc; }
.zone-item { cursor:pointer; border-radius:8px; padding:8px 6px; }
.zone-item:hover { background:#1a1a1a; }
.zone-item .num { background:#fff; color:#0a0a0a; border:2px solid #0a0a0a; }
.controls button small {
  display:block; font-size:9px; font-weight:700; line-height:1.05; margin-top:2px;
  text-transform:uppercase; letter-spacing:.02em; opacity:.9; color:#e5e5e5;
}
.controls { gap:6px; }
.controls button { min-width:52px; padding:8px 6px; font-size:16px; flex-direction:column; }
.controls {
  position:absolute; right:10px; bottom:10px; z-index:8;
  display:grid; grid-template-columns:repeat(3,48px); gap:6px;
  padding:8px; background:rgba(10,10,10,.88); border:1px solid var(--green);
  border-radius:14px; backdrop-filter:blur(6px);
}
.controls button {
  width:48px; height:48px; border:1px solid #2a2a2a; border-radius:10px;
  background:#141414; color:#fff; font-size:18px; font-weight:800;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.controls button:hover { border-color:var(--green); color:#fff; }
.controls button:active { background:var(--green); border-color:var(--green); }
.controls button.wide { grid-column:span 3; font-size:12px; letter-spacing:.02em; }
.controls button.active-edit { background:var(--green); color:#fff; border-color:var(--green); }
.hint {
  position:absolute; left:10px; bottom:10px; z-index:7;
  background:rgba(10,10,10,.85); color:#e5e5e5; font-size:11px;
  padding:8px 10px; border-radius:10px; max-width:min(220px,50vw); line-height:1.35;
  border:1px solid #2a2a2a;
}
.side-legend {
  flex:0 0 var(--legend-w); width:var(--legend-w); max-width:100%;
  background:var(--panel); border-left:1px solid var(--line);
  overflow:auto; padding:12px 14px 20px; -webkit-overflow-scrolling:touch;
  color:#e5e5e5;
}
.side-legend h2 {
  margin:0 0 6px; font-size:13px; color:#fff;
  text-transform:uppercase; letter-spacing:.04em;
}
.side-legend .badge {
  display:inline-block; background:var(--green); color:#fff;
  font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px;
  margin-bottom:8px;
}
.side-legend p, .side-legend li {
  margin:0 0 8px; font-size:12.5px; color:#a3a3a3; line-height:1.45;
}
.side-legend ul { margin:0 0 10px; padding-left:18px; }
.grad {
  height:14px; border-radius:6px; margin:6px 0 4px;
}
.grad.thermal { background:linear-gradient(90deg,#2e1065,#1e3a8a,#0284c7,#22d3ee,#4ade80,#facc15,#f97316,#dc2626,#fecaca); }
.grad.health { background:linear-gradient(90deg,#ef4444,#f97316,#22c55e); }
.grad.topo { background:linear-gradient(90deg,#f4efe6,#d4b483,#a16207,#5a2d0c,#1c0a02); }
.labs { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:10px; }
.zone-list { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.zone-item {
  display:flex; gap:10px; align-items:center; padding:8px 6px;
  font-size:13px; font-weight:600; color:#f5f5f5;
}
.zone-item .num {
  width:28px; height:28px; border-radius:50%; background:#fff;
  color:#0a0a0a; display:flex; align-items:center; justify-content:center; font-size:12px;
  border:2px solid #0a0a0a; flex:0 0 auto;
}
.zone-item small { display:block; font-weight:500; color:var(--muted); font-size:11px; }
.line-demo { display:flex; flex-direction:column; gap:8px; margin:8px 0 12px; }
.line-demo .row { display:flex; align-items:center; gap:10px; font-size:12px; color:#a3a3a3; }
.line-demo .sw { height:0; border-top:3px solid #d4a574; width:36px; flex:0 0 auto; }
.line-demo .sw.thin { border-top-width:1.5px; border-color:#a16207; }
.note-box {
  background:#1a1a1a; border:1px solid #404040; border-radius:10px;
  padding:8px 10px; font-size:11.5px; color:#d4d4d4; margin:8px 0 0; line-height:1.4;
}
.edit-panel {
  display:none; margin-top:12px; padding:10px; background:#0a0a0a; color:#e5e5e5;
  border-radius:12px; font-size:12px; line-height:1.4; border:1px solid var(--line);
}
.edit-panel.show { display:block; }
.edit-panel button, .edit-panel a.btn {
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; padding:0 12px; margin:6px 6px 0 0; border:0; border-radius:10px;
  background:var(--green); color:#fff; font-weight:700; font-size:12px; cursor:pointer;
  text-decoration:none;
}
.edit-panel textarea {
  width:100%; min-height:110px; margin-top:8px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px; border-radius:8px; border:1px solid #333; background:#000; color:#86efac;
  padding:8px;
}
.home-bar {
  flex:0 0 auto; text-align:center; padding:8px; background:#0a0a0a;
  border-top:1px solid var(--line); font-size:12px; color:#a3a3a3;
}
.home-bar a { color:var(--green-bright); font-weight:700; text-decoration:none; }

@media (max-width:820px) {
  body { overflow:auto; height:auto; min-height:100%; }
  .main { flex-direction:column; min-height:70vh; }
  .map-col { min-height:62vh; }
  .map-stage { min-height:58vh; }
  .side-legend {
    flex:0 0 auto; width:100%; border-left:0; border-top:1px solid var(--line);
    max-height:none;
  }
  .controls { right:8px; bottom:8px; grid-template-columns:repeat(3,44px); gap:5px; padding:6px; }
  .controls button { width:44px; height:44px; }
  .hint { display:none; }
}

.brand-logo {
  height: 56px; width: auto; max-width: 180px;
  object-fit: contain;
  background: #fff;
  border-radius: 10px;
  padding: 6px 10px;
  box-shadow: 0 0 0 1px rgba(34,197,94,.35), 0 4px 14px rgba(0,0,0,.35);
}
header {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
@media (max-width: 700px) {
  .brand-logo { height: 44px; max-width: 140px; padding: 4px 8px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>AWBREY GLEN · HOLE 7</h1>
    <p>Par 4 · 404–314 yds · Downhill · bend right · water left/long of green</p>
  </div>
  <img class="brand-logo" src="vyanet-logo-chip.png" alt="VYANET Drone Digital Mapping" />
</header>
<nav class="tabs" id="tabs">
  <button type="button" class="tab active" data-layer="thermal">Thermal</button>
  <button type="button" class="tab" data-layer="satellite">Satellite</button>
  <button type="button" class="tab" data-layer="topo">2D Topo</button>
  <button type="button" class="tab" data-layer="turfhealth">Turf Health</button>
  <a class="tab cta" href="../3d/hole7-3d.html">3D</a>
</nav>
<div class="main">
  <div class="map-col">
    <div class="map-stage" id="stage" aria-label="Hole map">
      <div class="map-world" id="world">
        <img class="layer" id="layerImg" src="view-thermal.jpg" alt="Hole layer" draggable="false" />
        <div id="pins"></div>
      </div>
      <div class="controls" aria-label="Map controls">
        <span></span>
        <button type="button" id="panUp" title="Pan up / North">↑<small>Up</small></button>
        <span></span>
        <button type="button" id="panLeft" title="Pan left / West">←<small>Left</small></button>
        <button type="button" id="fitBtn" title="Fit whole hole">⟲<small>Fit</small></button>
        <button type="button" id="panRight" title="Pan right / East">→<small>Right</small></button>
        <button type="button" id="zoomOut" title="Zoom out">−<small>Zoom out</small></button>
        <button type="button" id="panDown" title="Pan down / South">↓<small>Down</small></button>
        <button type="button" id="zoomIn" title="Zoom in">+<small>Zoom in</small></button>
        <button type="button" class="wide" id="editPinsBtn">Edit pins</button>
      </div>
      <div class="hint" id="hint">Drag to pan · arrows = move · +/− = zoom · tap zone # in legend to jump</div>
    </div>
  </div>
  <aside class="side-legend" id="legend" aria-live="polite"></aside>
</div>
<div class="home-bar"><a href="../index.html">All holes</a> · Awbrey Glen · VYANET Drone Digital Mapping</div>

<script>
(function() {
  const HOLE = 7;
  const STORAGE_KEY = 'vyanet-zones-hole' + HOLE + '-v6';
  // clear older keys that caused pin snap-back
  try { localStorage.removeItem('vyanet-zones-hole' + HOLE); localStorage.removeItem('vyanet-zones-hole' + HOLE + '-v4'); localStorage.removeItem('vyanet-zones-hole' + HOLE + '-v5'); sessionStorage.removeItem('vyanet-zones-hole' + HOLE); } catch (e) {}
  const DEFAULT_ZONES = {"1": {"x": 0.5464, "y": 0.8461}, "2": {"x": 0.5574, "y": 0.4834}, "3": {"x": 0.5113, "y": 0.1571}};
  const LAYER_ZONES = {"thermal": {"1": {"x": 0.585, "y": 0.885}, "2": {"x": 0.355, "y": 0.495}, "3": {"x": 0.3355, "y": 0.1781}}, "satellite": {"1": {"x": 0.5464, "y": 0.8461}, "2": {"x": 0.5574, "y": 0.4834}, "3": {"x": 0.5113, "y": 0.1571}}, "topo": {"1": {"x": 0.5464, "y": 0.8461}, "2": {"x": 0.5574, "y": 0.4834}, "3": {"x": 0.5113, "y": 0.1571}}, "turfhealth": {"1": {"x": 0.5464, "y": 0.8461}, "2": {"x": 0.5574, "y": 0.4834}, "3": {"x": 0.5113, "y": 0.1571}}};
  const LAYERS = {
    thermal: {
      src: 'view-thermal.jpg',
      badge: 'THERMAL',
      title: 'Cool → Hot thermal imagery',
      html: `
        <span class="badge">THERMAL</span>
        <h2>What this layer shows</h2>
        <p>Surface temperature patterns from thermal imagery. Cooler areas often hold more moisture; warmer areas may be drier or stressed.</p>
        <div class="grad thermal"></div>
        <div class="labs"><span>COOL</span><span>HOT</span></div>
        <ul>
          <li>Use for irrigation coverage and moisture clues</li>
          <li>Compare with Satellite and Turf Health for context</li>
          <li>Not elevation — brown topo lines live on the 2D Topo tab</li>
        </ul>`
    },
    satellite: {
      src: 'view-satellite.jpg',
      badge: 'SATELLITE',
      title: 'Stitched drone ortho',
      html: `
        <span class="badge">SATELLITE</span>
        <h2>Natural-color context</h2>
        <p>Stitched drone orthomosaic of this hole — fairway, bunkers, trees, cart path, and surrounds in true color.</p>
        <ul>
          <li>Best overview for orientation and pin placement</li>
          <li>Use pan/zoom to inspect tee, landing zones, and green</li>
          <li>Pair with Thermal / Turf Health for agronomy detail</li>
        </ul>`
    },
    topo: {
      src: 'view-topo.jpg',
      badge: '2D TOPO',
      title: 'Relative contours + hillshade',
      html: `
        <span class="badge">2D TOPO</span>
        <h2>Brown contours</h2>
        <p><strong>Brown lines</strong> = relative elevation contours estimated for this hole. Soft gray shading is hillshade (surface relief).</p>
        <h2>What the numbers mean</h2>
        <p>Labels are a <strong>relative elevation index 0–100 on THIS hole</strong>. Higher number = higher ground. Lower number = lower ground.</p>
        <div class="grad topo"></div>
        <div class="labs"><span>0 low</span><span>50</span><span>100 high</span></div>
        <div class="line-demo">
          <div class="row"><span class="sw"></span> Index contour (thicker, labeled)</div>
          <div class="row"><span class="sw thin"></span> Intermediate contour (thinner)</div>
        </div>
        <ul>
          <li>Lines close together = steeper slope</li>
          <li>Lines farther apart = flatter ground</li>
          <li><strong>Not</strong> survey feet/meters, LiDAR, or thermal</li>
        </ul>
        <div class="note-box">Demo / presentation grade from RGB drone imagery — not a NAVD88 survey datum.</div>`
    },
    turfhealth: {
      src: 'view-turfhealth.jpg',
      badge: 'TURF HEALTH',
      title: 'Critical / Stressed / Healthy',
      html: `
        <span class="badge">TURF HEALTH</span>
        <h2>RGB vegetation index (demo)</h2>
        <p>Three-band highlight from the drone RGB stitch — prioritize scouting, then verify on the ground.</p>
        <div class="grad health"></div>
        <div class="labs"><span>CRITICAL</span><span>STRESSED</span><span>HEALTHY</span></div>
        <ul>
          <li><strong style="color:#ef4444">Critical</strong> — lowest green vigor in the turf mask</li>
          <li><strong style="color:#f97316">Stressed</strong> — moderate / transition</li>
          <li><strong style="color:#22c55e">Healthy</strong> — strongest excess-green response</li>
        </ul>
        <div class="note-box">Demo from RGB (not a multispectral NDVI sensor).</div>`
    }
  };

  const ZONE_LABELS = {
    '1': ['Tee', 'Tee / start of the hole'],
    '2': ['Fairway', 'Mid-fairway corridor'],
    '3': ['Green', 'Approach / putting green']
  };

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const layerImg = document.getElementById('layerImg');
  const pinsEl = document.getElementById('pins');
  const legend = document.getElementById('legend');
  const editBtn = document.getElementById('editPinsBtn');

  let layer = 'thermal';
  let zones = loadZones();
  let scale = 1, tx = 0, ty = 0;
  let imgW = 1, imgH = 1;
  let editMode = false;
  let fitted = false;

  function loadZones() {
    try {
      localStorage.removeItem('vyanet-zones-hole' + HOLE);
      localStorage.removeItem('vyanet-zones-hole' + HOLE + '-v4');
      localStorage.removeItem('vyanet-zones-hole' + HOLE + '-v5');
      localStorage.removeItem('vyanet-zones-hole' + HOLE + '-v6');
      sessionStorage.removeItem('vyanet-zones-hole' + HOLE);
      sessionStorage.removeItem('vyanet-zones-hole' + HOLE + '-v5');
    } catch (e) {}
    const lz = (typeof LAYER_ZONES !== 'undefined' && LAYER_ZONES[layer]) ? LAYER_ZONES[layer] : DEFAULT_ZONES;
    return JSON.parse(JSON.stringify(lz));
  }

  function persistZones() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(zones));
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(zones));
    } catch (e) {}
    refreshEditJson();
    return zones;
  }

  function applyTransform() {
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  function fit() {
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    if (!imgW || !imgH || !sw || !sh) return;
    const s = Math.min(sw / imgW, sh / imgH) * 0.98;
    scale = s;
    tx = (sw - imgW * s) / 2;
    ty = (sh - imgH * s) / 2;
    applyTransform();
    fitted = true;
  }

  function panBy(dx, dy) {
    tx += dx; ty += dy; applyTransform();
  }
  function zoomAt(factor, cx, cy) {
    const rect = stage.getBoundingClientRect();
    const x = (cx != null ? cx : rect.left + rect.width/2) - rect.left;
    const y = (cy != null ? cy : rect.top + rect.height/2) - rect.top;
    const nx = (x - tx) / scale;
    const ny = (y - ty) / scale;
    const next = Math.min(8, Math.max(0.2, scale * factor));
    tx = x - nx * next;
    ty = y - ny * next;
    scale = next;
    applyTransform();
  }


  function jumpToPin(id) {
    const zz = zones[id];
    if (!zz || !imgW || !imgH) return;
    // Fit-ish zoom toward pin and center
    const rect = stage.getBoundingClientRect();
    const targetScale = Math.min(8, Math.max(scale, Math.min(rect.width / imgW, rect.height / imgH) * 2.4));
    scale = targetScale;
    tx = rect.width / 2 - zz.x * imgW * scale;
    ty = rect.height / 2 - zz.y * imgH * scale;
    applyTransform();
  }

  function placePins() {
    pinsEl.innerHTML = '';
    // pins layer must cover the image exactly
    pinsEl.style.position = 'absolute';
    pinsEl.style.left = '0';
    pinsEl.style.top = '0';
    pinsEl.style.width = imgW + 'px';
    pinsEl.style.height = imgH + 'px';
    pinsEl.style.pointerEvents = 'none';
    Object.keys(zones).sort().forEach(function(id) {
      const z = zones[id];
      if (!z) return;
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'pin';
      el.textContent = id;
      el.style.left = (z.x * 100) + '%';
      el.style.top = (z.y * 100) + '%';
      el.dataset.id = id;
      el.style.pointerEvents = 'auto';
      el.title = ZONE_LABELS[id] ? ZONE_LABELS[id][0] : ('Zone ' + id);

      el.addEventListener('click', function(ev) {
        if (editMode || el.dataset.didDrag === '1') {
          el.dataset.didDrag = '0';
          ev.preventDefault();
          ev.stopPropagation();
          return;
        }
        ev.stopPropagation();
        const zz = zones[id];
        if (!zz) return;
        const rect = stage.getBoundingClientRect();
        const px = tx + zz.x * imgW * scale;
        const py = ty + zz.y * imgH * scale;
        zoomAt(1.35, rect.left + px, rect.top + py);
        const sw = stage.clientWidth, sh = stage.clientHeight;
        tx += (sw/2 - (tx + zz.x * imgW * scale));
        ty += (sh/2 - (ty + zz.y * imgH * scale));
        applyTransform();
      });

      el.addEventListener('pointerdown', function(ev) {
        if (!editMode) return;
        ev.preventDefault();
        ev.stopPropagation();
        el.classList.add('dragging');
        el.dataset.didDrag = '0';
        const startX = ev.clientX, startY = ev.clientY;
        try { el.setPointerCapture(ev.pointerId); } catch (err) {}

        const move = function(e) {
          e.preventDefault();
          if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) {
            el.dataset.didDrag = '1';
          }
          // Measure against the IMAGE's on-screen box (survives pan/zoom/origin)
          const imgRect = layerImg.getBoundingClientRect();
          if (imgRect.width < 1 || imgRect.height < 1) return;
          let nx = (e.clientX - imgRect.left) / imgRect.width;
          let ny = (e.clientY - imgRect.top) / imgRect.height;
          nx = Math.min(1, Math.max(0, nx));
          ny = Math.min(1, Math.max(0, ny));
          zones[id] = { x: +nx.toFixed(4), y: +ny.toFixed(4) };
          el.style.left = (nx * 100) + '%';
          el.style.top = (ny * 100) + '%';
          refreshEditJson();
        };

        const up = function(e) {
          el.classList.remove('dragging');
          try { el.releasePointerCapture(ev.pointerId); } catch (err) {}
          window.removeEventListener('pointermove', move, true);
          window.removeEventListener('pointerup', up, true);
          window.removeEventListener('pointercancel', up, true);
          persistZones();
        };

        window.addEventListener('pointermove', move, true);
        window.addEventListener('pointerup', up, true);
        window.addEventListener('pointercancel', up, true);
      });

      pinsEl.appendChild(el);
    });
  }

  function zonesPayload() {
    return { hole: String(HOLE), zones: zones };
  }

  function refreshEditJson() {
    const ta = document.getElementById('zonesJson');
    if (ta) ta.value = JSON.stringify(zonesPayload(), null, 2);
  }

  function renderLegend() {
    const L = LAYERS[layer];
    let zonesHtml = '<div class="zone-list"><h2>Zones</h2><p style="margin:0 0 8px;font-size:12px;color:#64748b">Tap a number to jump there</p>';
    ['1','2','3'].forEach(function(id) {
      const lab = ZONE_LABELS[id];
      zonesHtml += '<div class="zone-item" data-jump="' + id + '" role="button" tabindex="0"><span class="num">' + id + '</span><div>' + lab[0] + '<small>' + lab[1] + '</small></div></div>';
    });
    zonesHtml += '</div>';
    let editHtml = `
      <div class="edit-panel ${editMode ? 'show' : ''}" id="editPanel">
        <strong>Pin editor</strong>
        <p style="margin:6px 0 0">Drag the numbered pins on the map. Positions are fractions of image width/height (0–1).</p>
        <button type="button" id="savePins">Save positions</button>
        <button type="button" id="resetPins">Reset defaults</button>
        <a class="btn" id="downloadZones" href="#">Download zones.json</a>
        <textarea id="zonesJson" readonly></textarea>
        <p style="margin:6px 0 0;color:#94a3b8">Saved to localStorage key <code>${STORAGE_KEY}</code>. Copy JSON or download for Blake to drop into the course pack.</p>
      </div>`;
    legend.innerHTML = L.html + zonesHtml + editHtml;
    refreshEditJson();
    legend.querySelectorAll('[data-jump]').forEach(function(row) {
      const go = function() { jumpToPin(row.getAttribute('data-jump')); };
      row.addEventListener('click', go);
      row.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    const save = document.getElementById('savePins');
    const reset = document.getElementById('resetPins');
    const dl = document.getElementById('downloadZones');
    if (save) save.onclick = function() {
      persistZones();
      save.textContent = 'Saved ✓';
      setTimeout(function(){ save.textContent = 'Save positions'; }, 1200);
    };
    if (reset) reset.onclick = function() {
      zones = loadZones();
      localStorage.removeItem(STORAGE_KEY);
      placePins(); refreshEditJson();
    };
    if (dl) dl.onclick = function(e) {
      e.preventDefault();
      const blob = new Blob([JSON.stringify(zonesPayload(), null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'zones.json'; a.click();
      URL.revokeObjectURL(url);
    };
  }


  function applyImageSize() {
    if (!layerImg.naturalWidth) return;
    imgW = layerImg.naturalWidth;
    imgH = layerImg.naturalHeight;
    layerImg.style.width = imgW + 'px';
    layerImg.style.height = imgH + 'px';
    world.style.width = imgW + 'px';
    world.style.height = imgH + 'px';
    zones = loadZones();
    placePins();
  }

  function setLayer(name) {
    if (!LAYERS[name]) return;
    layer = name;
    document.querySelectorAll('.tab[data-layer]').forEach(function(t) {
      t.classList.toggle('active', t.dataset.layer === name);
    });
    const keep = { scale: scale, tx: tx, ty: ty, fitted: fitted };
    const src = LAYERS[name].src;
    const afterLoad = function() {
      applyImageSize();
      if (!keep.fitted) fit();
      else { scale = keep.scale; tx = keep.tx; ty = keep.ty; applyTransform(); }
    };
    layerImg.onload = afterLoad;
    // Force reload path if same cache quirks
    if (layerImg.getAttribute('src') === src && layerImg.complete && layerImg.naturalWidth) {
      afterLoad();
    } else {
      layerImg.src = src;
      if (layerImg.complete && layerImg.naturalWidth) afterLoad();
    }
    renderLegend();
    if (location.hash.replace('#','') !== name) {
      history.replaceState(null, '', '#' + name);
    }
  }

  // tabs
  document.getElementById('tabs').addEventListener('click', function(e) {
    const t = e.target.closest('[data-layer]');
    if (t) setLayer(t.dataset.layer);
  });

  // controls
  const panStep = function() { return Math.min(stage.clientWidth, stage.clientHeight) * 0.12; };
  document.getElementById('panUp').onclick = function(){ panBy(0, panStep()); };
  document.getElementById('panDown').onclick = function(){ panBy(0, -panStep()); };
  document.getElementById('panLeft').onclick = function(){ panBy(panStep(), 0); };
  document.getElementById('panRight').onclick = function(){ panBy(-panStep(), 0); };
  document.getElementById('zoomIn').onclick = function(){ zoomAt(1.25); };
  document.getElementById('zoomOut').onclick = function(){ zoomAt(1/1.25); };
  document.getElementById('fitBtn').onclick = function(){ fit(); };
  editBtn.onclick = function() {
    if (editMode) {
      persistZones();
      editMode = false;
      editBtn.classList.remove('active-edit');
      editBtn.textContent = 'Edit pins';
      stage.classList.remove('edit-pins');
      renderLegend();
      const tip = document.getElementById('hint');
      if (tip) {
        tip.textContent = 'Pins saved · 1(' + zones['1'].x + ',' + zones['1'].y + ') 2(' + zones['2'].x + ',' + zones['2'].y + ') 3(' + zones['3'].x + ',' + zones['3'].y + ')';
      }
    } else {
      editMode = true;
      editBtn.classList.add('active-edit');
      editBtn.textContent = 'Done — save pins';
      stage.classList.add('edit-pins');
      renderLegend();
    }
  };

  // pointer drag pan
  let dragging = false, lastX=0, lastY=0;
  stage.addEventListener('pointerdown', function(e) {
    if (editMode || e.target.closest('.controls') || e.target.closest('.pin')) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    panBy(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  });
  stage.addEventListener('pointerup', function() {
    dragging = false; stage.classList.remove('dragging');
  });
  stage.addEventListener('pointercancel', function() {
    dragging = false; stage.classList.remove('dragging');
  });

  // wheel zoom toward cursor
  stage.addEventListener('wheel', function(e) {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive:false });

  // pinch zoom
  let pinch = null;
  stage.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      const a = e.touches[0], b = e.touches[1];
      pinch = {
        dist: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
        cx: (a.clientX+b.clientX)/2,
        cy: (a.clientY+b.clientY)/2
      };
      dragging = false;
    }
  }, {passive:true});
  stage.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && pinch) {
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      const cx = (a.clientX+b.clientX)/2, cy = (a.clientY+b.clientY)/2;
      zoomAt(dist / pinch.dist, pinch.cx, pinch.cy);
      panBy(cx - pinch.cx, cy - pinch.cy);
      pinch = { dist: dist, cx: cx, cy: cy };
    }
  }, {passive:false});
  stage.addEventListener('touchend', function() { pinch = null; });

  window.addEventListener('resize', function() { if (fitted) fit(); });

  // boot from hash
  const boot = (location.hash || '#thermal').replace('#','').toLowerCase();
  const start = LAYERS[boot] ? boot : 'thermal';
  setLayer(start);
})();
</script>
</body>
</html>
