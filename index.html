<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awbrey Glen — VYANET</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", Times, serif;
    background: #0a0a0a;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 56px;
  }
  .brand {
    width: min(920px, 100%);
    margin: 0 auto;
    background: #0b1f12;
    border-bottom: 2px solid #16a34a;
  }
  .brand img {
    display: block;
    width: 100%;
    max-height: 130px;
    object-fit: cover;
  }
  .wrap {
    width: min(920px, 100%);
    margin: 36px auto 0;
    text-align: center;
  }
  .wrap h1 {
    margin: 0;
    font-size: clamp(26px, 4vw, 34px);
    letter-spacing: .12em;
    font-weight: 700;
    color: #fff;
  }
  .wrap .sub {
    margin: 10px 0 36px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #a3a3a3;
    font-size: 14px;
    letter-spacing: .02em;
  }
  .holes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 280px));
    gap: 28px;
    justify-content: center;
  }
  @media (max-width: 620px) {
    .holes { grid-template-columns: 1fr; max-width: 300px; margin: 0 auto; }
  }
  a.hole {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-decoration: none;
    color: #f5f5f5;
    background: linear-gradient(180deg, #171717 0%, #111 100%);
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 28px 20px 24px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  a.hole:hover, a.hole:focus {
    border-color: #16a34a;
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(22,163,74,.2);
    outline: none;
  }
  a.hole .mark {
    width: 168px;
    height: 168px;
    object-fit: contain;
    margin: 0 0 22px;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  a.hole .label {
    font-family: Georgia, "Times New Roman", Times, serif;
    text-align: center;
    width: 100%;
  }
  a.hole .course {
    display: block;
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #86efac;
    font-weight: 700;
    margin: 0 0 8px;
  }
  a.hole .hole-name {
    display: block;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #fff;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  a.hole .par {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #a3a3a3;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="vyanet-logo-banner.png" alt="VYANET Drone Digital Mapping" />
  </div>
  <div class="wrap">
    <h1>AWBREY GLEN</h1>
    <p class="sub">Select a hole</p>
    <div class="holes">
      <a class="hole" href="hole-7/index.html?v=25">
        <img class="mark" src="awbrey-glen-mark.png" alt="Awbrey Glen" />
        <div class="label">
          <span class="course">Awbrey Glen</span>
          <span class="hole-name">Hole 7</span>
          <span class="par">Par 4</span>
        </div>
      </a>
      <a class="hole" href="hole-17/index.html?v=25">
        <img class="mark" src="awbrey-glen-mark.png" alt="Awbrey Glen" />
        <div class="label">
          <span class="course">Awbrey Glen</span>
          <span class="hole-name">Hole 17</span>
          <span class="par">Par 4</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
