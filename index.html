<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awbrey Glen — VYANET</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 48px;
  }
  .brand {
    width: min(960px, 100%);
    margin: 0 auto;
    background: #0b1f12;
    border-bottom: 2px solid #16a34a;
  }
  .brand img {
    display: block;
    width: 100%;
    max-height: 120px;
    object-fit: cover;
  }
  .wrap {
    width: min(960px, 100%);
    margin: 28px auto 0;
    text-align: center;
  }
  .wrap h1 {
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: .06em;
    font-weight: 800;
  }
  .wrap p {
    margin: 0 0 28px;
    color: #a3a3a3;
    font-size: 14px;
  }
  .holes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    max-width: 640px;
    margin: 0 auto;
  }
  a.hole {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #f5f5f5;
    background: #141414;
    border: 1px solid #262626;
    border-radius: 18px;
    padding: 22px 16px 18px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
    min-height: 280px;
  }
  a.hole:hover, a.hole:focus {
    border-color: #16a34a;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(22,163,74,.18);
    outline: none;
  }
  a.hole .mark {
    width: 148px;
    height: 148px;
    object-fit: contain;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
  }
  a.hole .label {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .03em;
    line-height: 1.35;
  }
  a.hole .label span {
    display: block;
    font-weight: 600;
    font-size: 13px;
    color: #a3a3a3;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="vyanet-logo-banner.png" alt="VYANET Drone Digital Mapping" />
  </div>
  <div class="wrap">
    <h1>AWBREY GLEN</h1>
    <p>Select a hole to open its interactive viewer</p>
    <div class="holes">
      <a class="hole" href="hole-7/index.html?v=21">
        <img class="mark" src="awbrey-glen-mark.png" alt="Awbrey Glen" />
        <div class="label">Awbrey Glen Hole 7<span>Par 4</span></div>
      </a>
      <a class="hole" href="hole-17/index.html?v=21">
        <img class="mark" src="awbrey-glen-mark.png" alt="Awbrey Glen" />
        <div class="label">Awbrey Glen Hole 17<span>Par 4</span></div>
      </a>
    </div>
  </div>
</body>
</html>
